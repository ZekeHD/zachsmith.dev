name: Linda required for merge

on:
  pull_request:
    types:
      [
        opened,
        reopened,
        synchronize,
        labeled,
        unlabeled,
        review_requested,
        review_request_removed,
      ]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  checks: write

jobs:
  validate-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Evaluate Review Conditions
        id: evaluate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_USER: "lsi1verthorn"
          TARGET_LABEL: "linda-required"
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          LABELS=$(gh pr view $PR_NUMBER --json labels -q '.labels[].name')

          echo "::notice::Raw reviews output:"
          gh pr view $PR_NUMBER --json reviews -q '.reviews[]'

          PENDING_REVIEWERS=$(gh pr view $PR_NUMBER --json reviewRequests -q '.reviewRequests[].login')
          APPROVED_USERS=$(gh pr view $PR_NUMBER --json reviews -q '.reviews | group_by(.author.login) | map(max_by(.submittedAt) | select(.state == "APPROVED")) | .[].author.login')

          if [ -n "$PENDING_REVIEWERS" ]; then
            APPROVED_USERS=$(comm -23 <(echo "$APPROVED_USERS" | sort) <(echo "$PENDING_REVIEWERS" | sort))
          fi

          TOTAL_APPROVALS=$(echo "$APPROVED_USERS" | grep -v '^$' | wc -l)

          RESULT="success"
          MESSAGE=""

          if echo "$LABELS" | grep -qx "$TARGET_LABEL"; then
            if echo "$APPROVED_USERS" | grep -qx "$REQUIRED_USER"; then
              if [ "$TOTAL_APPROVALS" -ge 2 ]; then
                MESSAGE="Required reviewer approved + $TOTAL_APPROVALS total approvals."
              else
                RESULT="failure"
                MESSAGE="Required reviewer approved, but needs at least 1 more approval."
              fi
            else
              RESULT="failure"
              MESSAGE="Label '$TARGET_LABEL' present; must be approved by $REQUIRED_USER."
            fi
          else
            if [ "$TOTAL_APPROVALS" -ge 2 ]; then
              MESSAGE="$TOTAL_APPROVALS approvals satisfy the standard rule."
            else
              RESULT="failure"
              MESSAGE="Standard PRs require 2 approvals. Current: $TOTAL_APPROVALS."
            fi
          fi

          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"

      - name: Publish consolidated check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          CHECK_NAME="Linda required for merge"
          CONCLUSION="${{ steps.evaluate.outputs.result }}"
          SUMMARY="${{ steps.evaluate.outputs.message }}"

          EXISTING_ID=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" \
            -q ".check_runs[] | select(.name == \"$CHECK_NAME\") | .id" | head -n1)

          if [ -n "$EXISTING_ID" ]; then
            gh api "repos/${{ github.repository }}/check-runs/$EXISTING_ID" \
              -X PATCH \
              -f status="completed" \
              -f conclusion="$CONCLUSION" \
              -f "output[title]=Review validation" \
              -f "output[summary]=$SUMMARY"
          else
            gh api "repos/${{ github.repository }}/check-runs" \
              -f name="$CHECK_NAME" \
              -f head_sha="$SHA" \
              -f status="completed" \
              -f conclusion="$CONCLUSION" \
              -f "output[title]=Review validation" \
              -f "output[summary]=$SUMMARY"
          fi
